<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyntaxSplat</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d1226; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #d7e6f2; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #ui { position: fixed; top: 10px; left: 10px; background: rgba(13,18,38,.82); border: 1px solid #2e4a7d; border-radius: 6px; padding: 10px 12px; width: 230px; }
  #ui[hidden] { display: none; }
  #ui label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
  #ui input[type=range] { width: 120px; }
  #ui .grp { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2e4a7d; color: #8fb4d9; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #ui button { flex: 1; }
  #hud { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2e4a7d; color: #8fb4d9; white-space: pre-line; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #0d1226; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <label>Scene <select id="scene"></select></label>
  <label>Pixel art <input id="pixel" type="checkbox" checked></label>
  <label>Pixel rows <input id="rows" type="range" min="90" max="540" step="10" value="360"></label>
  <label>Splat size <input id="size" type="range" min="0.2" max="4" step="0.05" value="1.8"></label>
  <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label>Animate <input id="anim" type="checkbox" checked></label>
  <label>Auto orbit <input id="orbit" type="checkbox"></label>
  <div class="grp">Look</div>
  <label>Palette <select id="palette"></select></label>
  <label>Brush <select id="brush"><option value="0">Soft dab</option><option value="1">Hard disc</option><option value="2">Square</option><option value="3">Long stroke</option></select></label>
  <label>Outline <input id="outline" type="checkbox"></label>
  <label>Depth of field <input id="dof" type="checkbox"></label>
  <label>Focus <input id="focus" type="range" min="1" max="40" step="0.5" value="10"></label>
  <div class="grp">Scene effects</div>
  <label>Live lights <input id="live" type="checkbox" checked></label>
  <label>Particles <input id="particles" type="checkbox" checked></label>
  <div class="grp">Data</div>
  <label><button id="exportPly" type="button">Export .ply</button> <button id="rebake" type="button">Rebake</button></label>
  <div id="hud"></div>
</div>
<div id="load">Painting splats…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
